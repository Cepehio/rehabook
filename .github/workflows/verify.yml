name: Projekto patikra
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehabook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rehabook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehabook_test?schema=public&connection_limit=5
      JWT_SECRET: ci-only-secret-never-use-in-production
      MAIL_MODE: file
      REMINDERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run test:config
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run lint
      - run: npm test
      - run: npm test
        working-directory: server
      - run: npm run build
